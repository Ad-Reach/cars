name: Server inspect

# Только чтение: что сейчас крутится на сервере (сайты Caddy, службы, Docker, место на диске).
on:
  push:
    branches: [ccr-d0ccb5ba-g8vfps]
    paths: [.github/workflows/server-inspect.yml, deploy/fix-key.py]
  workflow_dispatch:

env:
  HOST: 185.196.117.71

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Reachability
        run: |
          for p in 22 1488 80 443; do timeout 8 bash -c "echo > /dev/tcp/$HOST/$p" 2>/dev/null && echo "port $p: open" || echo "port $p: CLOSED"; done
          install -m 700 -d ~/.ssh
          printf 'Host %s\n  Port 1488\n' $HOST > ~/.ssh/config
          ssh-keyscan -T 30 -p 1488 $HOST 2>/dev/null | sort | tee ~/.ssh/known_hosts
          grep -q ssh- ~/.ssh/known_hosts || { echo "::error::SSH на порту 1488 не отвечает"; exit 1; }

      - name: Inspect (read-only)
        run: |
          KEY="${{ secrets.ROOT_SSH_KEY }}" python3 deploy/fix-key.py > ~/.ssh/root_key; chmod 600 ~/.ssh/root_key
          ssh-keygen -l -f ~/.ssh/root_key || { echo "::error::Ключ ROOT_SSH_KEY не читается"; exit 1; }
          for u in w1thluv eblan lera root eblo; do
            if ssh -i ~/.ssh/root_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 $u@$HOST true 2>/dev/null; then echo "ключ пускает как $u"; U=$u; break; else echo "$u — нет"; fi
          done
          if [ -z "${U:-}" ]; then
            echo "== какие методы входа разрешает сервер (для root):"
            ssh -o PreferredAuthentications=none -o BatchMode=yes root@$HOST true 2>&1 | grep -i "authentications that can continue" || true
            exit 1
          fi
          ssh -i ~/.ssh/root_key -o IdentitiesOnly=yes $U@$HOST 'set +e
            echo "== кто я"; whoami; id -nG
            echo "== sudo без пароля"; sudo -n true 2>/dev/null && echo "sudo-n: ДА" || echo "sudo-n: нет"
            echo "== 443 держит (docker)"; docker ps --format "{{.Names}}  {{.Image}}  {{.Ports}}"
            echo "== 443/1337/3000 (sudo)"; sudo -n ss -ltnp 2>/dev/null | grep -E ":(443|1337|3000) " || echo "нет данных без root"
            echo "== node"; command -v node && node -v || echo "node нет"
            echo "== caddy global"; sudo -n head -8 /etc/caddy/Caddyfile 2>/dev/null || head -8 /etc/caddy/Caddyfile 2>/dev/null
            echo "== свободно"; df -h / | tail -1'
