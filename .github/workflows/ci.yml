name: CI

# Проверка сборки на PR и main. Зелёный main сам уходит в production,
# App Platform пересобирает Dockerfile и выкладывает (настройки — Ad-Reach/infra).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: docker build -t rangauto .

  # Зелёный main автоматически уходит в production → App Platform выкладывает сайт.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://rangauto.ru
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge main into production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B production origin/production
          git merge --no-edit "$GITHUB_SHA" -m "Merge main into production (${GITHUB_SHA::7})"
          git push origin production
      - name: Wait for live site
        continue-on-error: true
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://rangauto.ru/ || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          exit 1
