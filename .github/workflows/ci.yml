name: CI

# Проверка сборки. Деплой делает Timeweb App Platform сам:
# пуш в production → пересборка Dockerfile → выкладка (настройки — репозиторий Ad-Reach/infra).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: docker build -t rangauto .
