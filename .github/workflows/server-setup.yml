name: Server setup

# Общий сервер 185.196.117.71. Запускается вручную (workflow_dispatch).
# stage=cleanup — чистка места, снос VPN pasarguard, удаление сайтов dashaanddima/rsy.
# Вход: ключ ROOT_SSH_KEY (пускает как w1thluv, он в группе sudo), пароль sudo — секрет ROOT_PW.
on:
  push:
    branches: [ccr-d0ccb5ba-g8vfps]
    paths: [deploy/RUN]
  workflow_dispatch:

env:
  HOST: 185.196.117.71

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: SSH ready
        run: |
          install -m 700 -d ~/.ssh
          printf 'Host %s\n  Port 1488\n' $HOST > ~/.ssh/config
          ssh-keyscan -T 30 -p 1488 $HOST 2>/dev/null | sort > ~/.ssh/known_hosts
          KEY="${{ secrets.ROOT_SSH_KEY }}" python3 deploy/fix-key.py > ~/.ssh/id; chmod 600 ~/.ssh/id
          ssh-keygen -l -f ~/.ssh/id

      - name: Run as root
        env:
          ROOT_PW: ${{ secrets.ROOT_PW }}
        run: |
          [ -n "$ROOT_PW" ] || { echo "::error::Нет секрета ROOT_PW (пароль sudo пользователя w1thluv)"; exit 1; }
          SCRIPT=$(head -1 deploy/RUN | awk '{print $1}')   # имя скрипта из первой строки deploy/RUN
          echo "Запускаю deploy/$SCRIPT от root"
          [ -f "deploy/$SCRIPT" ] || { echo "::error::нет deploy/$SCRIPT"; exit 1; }
          SSH="ssh -i $HOME/.ssh/id -o IdentitiesOnly=yes w1thluv@$HOST"
          scp -i ~/.ssh/id -o IdentitiesOnly=yes "deploy/$SCRIPT" w1thluv@$HOST:/tmp/run.sh
          $SSH 'sudo -S -p "" bash /tmp/run.sh; rc=$?; rm -f /tmp/run.sh; exit $rc' <<< "$ROOT_PW" 2>&1 | grep -vi "try again" || true
          $SSH 'sudo -S -p "" true' <<< "$ROOT_PW" 2>/dev/null && echo "SUDO-OK" || { echo "::error::Пароль ROOT_PW не подходит"; exit 1; }
