name: Server bootstrap

# Разовая настройка нового сервера от root (deploy/bootstrap-server.sh).
# Пароль root лежит в deploy/root-password.age, зашифрованный ключом из секрета DEPLOY_SSH_KEY.
on:
  push:
    branches: [ccr-d0ccb5ba-g8vfps]
    paths: [deploy/**, .github/workflows/server-bootstrap.yml]
  workflow_dispatch:

concurrency:
  group: server-bootstrap
  cancel-in-progress: false

env:
  HOST: 31.77.10.198

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Deploy key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "Публичная часть DEPLOY_SSH_KEY:"
          ssh-keygen -y -f ~/.ssh/id_ed25519 | tee deploy_pub.txt

      - name: Host keys
        run: ssh-keyscan -T 20 $HOST 2>/dev/null | sort | tee ~/.ssh/known_hosts

      - name: Run bootstrap as root
        run: |
          [ -f deploy/root-password.age ] || { echo "Нет deploy/root-password.age — пока только вывожу ключ"; exit 0; }
          sudo apt-get install -y -qq sshpass age >/dev/null
          export SSHPASS="$(age -d -i ~/.ssh/id_ed25519 deploy/root-password.age)"
          echo "::add-mask::$SSHPASS"
          {
            printf 'export DEPLOY_PUBKEYS=%q\n' "$(cat deploy_pub.txt)"
            cat deploy/bootstrap-server.sh
          } > run.sh
          sshpass -e scp -o PubkeyAuthentication=no run.sh root@$HOST:/root/bootstrap.sh
          sshpass -e ssh -o PubkeyAuthentication=no root@$HOST 'bash /root/bootstrap.sh'

      - name: Check login as deploy
        run: |
          [ -f deploy/root-password.age ] || exit 0
          ssh -o BatchMode=yes deploy@$HOST 'echo "whoami: $(whoami)"; sudo -n true 2>/dev/null && echo "sudo: ЕСТЬ" || echo "sudo: нет"'
