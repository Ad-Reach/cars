name: Sync new cars UAE

# Каталог новых авто из ОАЭ (rangauto.ru/new/uae): раз в сутки берёт цены из Google-таблицы и докачивает
# фото с Яндекс.Диска (scripts/sync-new-cars-uae.py). Изменения коммитятся в main → CI → production.
# Запускается и сразу после того, как в main поменялись скрипт или копия таблицы (source.csv).
on:
  schedule:
    - cron: "43 2 * * *" # 05:43 МСК
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync-new-cars-uae.py
      - src/data/new-cars-uae/source.csv

concurrency:
  group: sync-new-cars-uae
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/sync-new-cars-uae.py
      - name: Commit changes
        run: |
          git add src/data/new-cars-uae public/new-cars-uae
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Каталог новых авто из ОАЭ: обновление цен и фото $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
      # push от GITHUB_TOKEN не запускает другие workflow — запускаем CI (проверка и выкладка) явно
      - name: Deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
