name: Deploy CMS

# Админка https://rangauto.ru/cms/admin — собирается из ветки production.
# Разовая настройка сервера: deploy/bootstrap-server.sh (root, workflow «Server bootstrap»).
on:
  push:
    branches: [production]
    paths: [cms/**, .github/workflows/deploy-cms.yml]
  workflow_dispatch:

concurrency:
  group: production-cms
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rangauto.ru/cms/admin
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
          PUBLIC_URL: https://rangauto.ru/cms
          ADMIN_COOKIE_PATH: /cms/admin
      - run: npm prune --omit=dev

      - name: Assemble release
        run: |
          mkdir -p ../cms-release
          cp -r dist node_modules package.json tsconfig.json favicon.png seed ../cms-release/
          mkdir -p ../cms-release/public
          cp public/robots.txt ../cms-release/public/

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp ../deploy/known_hosts ~/.ssh/known_hosts

      - name: Upload and switch release
        env:
          HOST: 31.77.10.198
          REL: ${{ github.sha }}
        run: |
          if ! ssh deploy@$HOST "test -d /srv/rangauto/cms/releases"; then
            echo "::warning::Сервер ещё не настроен для CMS: запустите workflow «Server bootstrap» и перезапустите этот workflow"
            echo "CMS_SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          rsync -az --delete --link-dest=/srv/rangauto/cms/current/ ../cms-release/ deploy@$HOST:/srv/rangauto/cms/releases/$REL/
          ssh deploy@$HOST "set -e
            cd /srv/rangauto/cms
            ln -sfn /srv/rangauto/cms/uploads releases/$REL/public/uploads
            ln -sfn releases/$REL current.tmp && mv -Tf current.tmp current
            date -u +%FT%TZ > deployed
            ls -1dt releases/* | tail -n +4 | xargs -r rm -rf
          "

      - name: Health check
        if: env.CMS_SKIPPED != '1'
        env:
          HOST: 31.77.10.198
        run: |
          for i in $(seq 1 40); do
            code=$(ssh deploy@$HOST "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:1337/_health" || true)
            [ "$code" = "204" ] && echo "OK" && exit 0
            sleep 5
          done
          echo "CMS не ответила после деплоя"; exit 1
